name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          direct_prompt: |
            Review the pull request #${{ github.event.pull_request.number }} in this repository.

            1. First, read the PR diff using `gh pr diff ${{ github.event.pull_request.number }}`
            2. Analyze all changed files thoroughly
            3. Then post a comment on the PR using `gh pr comment ${{ github.event.pull_request.number }}` with the following format:

            ## 📋 Code Review Report

            ### Scorecard

            | Category | Status | Details |
            |----------|--------|---------|
            | 🔒 Security & Vulnerabilities | ✅ OK / ⚠️ Medium / ❌ Critical | explanation |
            | 📖 Code Quality & Readability | ✅ OK / ⚠️ Medium / ❌ Critical | explanation |
            | ⚡ Performance | ✅ OK / ⚠️ Medium / ❌ Critical | explanation |
            | 🛡️ Error Handling | ✅ OK / ⚠️ Medium / ❌ Critical | explanation |
            | 🏗️ Architecture & Patterns | ✅ OK / ⚠️ Medium / ❌ Critical | explanation |
            | 🧪 Testing | ✅ OK / ⚠️ Medium / ❌ Critical | explanation |
            | 📱 Android Best Practices | ✅ OK / ⚠️ Medium / ❌ Critical | explanation |

            ### 🎯 Overall Risk: 🟢 Low / 🟡 Medium / 🔴 High

            ### 📊 Summary
            - Files reviewed: X
            - Issues found: X
            - Critical: X | Warnings: X | Info: X

            ### 🔍 Key Findings
            List the most important findings with file references

            ### 💡 Recommendations
            List actionable improvements

            ---
            _Reviewed by Claude Code_

            IMPORTANT: You MUST post this as a PR comment using the gh CLI. Do not just output it.
